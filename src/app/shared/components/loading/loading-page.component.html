<div class="loading-container z-99999 flex fixed top-0 left-0 w-full h-full bg-white" *ngIf="showLoader">
  <div class="loading-group" style="animation-delay: 0s;">
    <div class="loading-letter mr-1 text-bluePrimary">P</div>
    <div class="loading-points">.</div>
  </div>
  <div class="loading-group" style="animation-delay: 0.25s;">
    <div class="loading-letter mr-1 text-hellowPrimary">P</div>
    <div class="loading-points">.</div>
  </div>
  <div class="loading-group" style="animation-delay: 0.5s;">
    <div class="loading-letter text-bluePrimary">P</div>
    <div class="loading-points text-blackPrimary">.</div>
  </div>
</div>
