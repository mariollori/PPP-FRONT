<div class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-75 px-5 py-14" *ngIf="isOpen">
  <div class="bg-white p-5 rounded-2xl shadow-md max-h-[100%]">
    <div class="flex-grow">
      <ng-content></ng-content>
    </div>
    <div class="mt-5 flex justify-end">
      <button
        class="px-5 py-2 bg-bluePrimary transition-all duration-300 hover:bg-blueSecondary text-white rounded-[10px]"
        (click)="showCloseConfirmation()">{{closeText}}</button>
      <button
        class="ml-3 px-5 py-2 bg-hellowPrimary transition-all duration-300 hover:bg-hellowSecondary text-white rounded-[10px]"
        *ngIf="buttonAccion">{{textButtonAccion}}</button>
    </div>
  </div>
</div>
