<div class="container mx-auto overflow-y-auto overflow-scroll">
  <div class="flex flex-col gap-6">
    <span class="text-xl font-montserrat">Subir {{this.title}}</span>
    <span>Por favor adjunta tu {{this.message}}, segun el formato que se le esta pidiendo.</span>
    <div class="lg:col-span-3 md:col-span-2 text-center rounded-3xl border-dashed border-2 border-sky-700">
      <label for="bannerInput"
        class="w-full h-32 shadow-lg py-20 bg-sky-100 rounded-3xl flex text-center justify-center items-center flex-col cursor-pointer hover:bg-sky-50 transition-all duration-300">

        <img class="h-16 mb-2" src="assets/png/imagen.png">

        <span class="text-bluePrimary font-[580]">Suba su {{this.message}}aquí.</span>
        <span class="font-light" *ngIf="!documentCvCharged">Solo pude subir archivos PDF</span>

        <input id="bannerInput" type="file" class="hidden" accept=".pdf">

      </label>
    </div>

    <div class="flex justify-end">
      <button
        class="px-5 py-2 bg-bluePrimary transition-all duration-300 hover:bg-blueSecondary text-white rounded-[10px]">Cancelar</button>
      <button
        class="ml-3 px-5 py-2 bg-hellowPrimary transition-all duration-300 hover:bg-hellowSecondary text-white rounded-[10px]">Subir
        documento</button>
    </div>
  </div>
</div>
