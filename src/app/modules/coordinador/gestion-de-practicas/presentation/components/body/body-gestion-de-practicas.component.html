<div class="overflow-y-auto overflow-scroll">
  <div class="flex flex-col gap-6"
    *ngIf="position == null || position == 2 || position == 3 || position == 4 || position == 5 || position == 6">
    <h1 class="text-3xl font-montserrat">Bienvenido, <span class="font-bold font-montserrat">David Reyna </span>
    </h1>
    <h3 class="font-bold text-xl font-montserrat">Configuracion general</h3>
    <div>
      <label class="mb-2 text-lg font-[500] font-montserrat">
        Gestion de usuarios
      </label>
      <p class=" text-[#9C9C9C] font-montserrat text-[13.5px]">
        Cada cartilla está representando a un rol de usuario específico en el sistema web.
      </p>
      <div class="flex gap-6 py-4 w-full flex-wrap h-auto
                    max-md:justify-center">
        <div *ngFor="let items of gestion_users" (click)="toggleModal(items.position)"
          class="w-60 h-60 rounded-xl shadow-lg cursor-pointer bg-white px-5 py-4 flex flex-col hover:bg-neutral-200">
          <div class="h-[65%] flex items-center justify-center">
            <img class="h-full" [src]="items.image">
          </div>
          <div class="h-10"></div>
          <div class="h-[40%] text-center flex items-center justify-center font-montserrat px-5">
            <span>{{items.title}}</span>
          </div>
        </div>
      </div>
    </div>
    <div>
      <label class="mb-2 text-lg font-[500] font-montserrat">
        Gestión de plan de practicas pre profesionales
      </label>
      <p class=" text-[#9C9C9C] font-montserrat text-[13.5px]">
        Recuerda que cada plan de practicas va de la mano con los planes academicos (intervalo de 4 años).</p>
      <div class="flex gap-6 py-4 flex-wrap h-auto
          max-md:justify-center">
        <div *ngFor="let items of gestion_plan" (click)="toggleModal(items.position)"
          class="w-60 h-60 rounded-xl shadow-lg cursor-pointer bg-white px-5 py-4 flex flex-col hover:bg-neutral-200">
          <div class="h-[65%] flex items-center justify-center text-center">
            <img class="h-full" [src]="items.image">
          </div>
          <div class="h-10"></div>
          <div class="h-[40%] text-center flex items-center justify-center font-montserrat px-5">
            <span>{{items.title}}</span>
          </div>
        </div>

      </div>
    </div>

  </div>

  <modal-config-practicante *ngIf="position == 1"></modal-config-practicante>
</div>

<global-modal [isOpen]="modalOpen" (close)="modalOpen = false" *ngIf="modalOpen" (actionOpen)="actionOpen()">
  <ng-container [ngSwitch]="position">
    <!-- <modal-config-practicante *ngSwitchCase="'1'"></modal-config-practicante> -->
    <modal-config-supervisor *ngSwitchCase="'2'"></modal-config-supervisor>
    <create-new-plan [typeDocumentList]="typeDocumentsListAll" *ngSwitchCase="'4'" (createNewPlan)="createNewPlan($event, 4)"></create-new-plan>
    <create-new-item *ngSwitchCase="'6'"></create-new-item>
  </ng-container>
</global-modal>

<loading-page></loading-page>
